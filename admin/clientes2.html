<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | ERMA Seguridad</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="contenedor">

    <h1>Clientes</h1>

    <p>Módulo de administración de clientes.</p>

    <button id="btnNuevo">
        + Nuevo Cliente
    </button>

    <div id="modalCliente" class="modal" style="display:none;">

        <div class="modal-contenido">

            <h2>Nuevo Cliente</h2>

            <input id="nombre" placeholder="Nombre del cliente">

            <input id="empresa" placeholder="Empresa">

            <input id="telefono" placeholder="Teléfono">

            <input id="correo" placeholder="Correo">

            <input id="direccion" placeholder="Dirección">

            <select id="estado">
                <option>Activo</option>
                <option>Suspendido</option>
            </select>

            <br><br>

            <button id="guardarCliente">
                Guardar
            </button>

            <button id="cerrarModal">
                Cancelar
            </button>

        </div>

    </div>

    <table id="tablaClientes">

        <thead>

            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>

        </thead>

        <tbody>

        </tbody>

    </table>

</div>

<script src="clientes.js"></script>

</body>
</html>
