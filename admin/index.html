<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERMA Seguridad | Panel Administrativo</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="encabezado">

    <h1>ERMA Seguridad Privada</h1>

    <p>Panel Administrativo</p>

</header>

<main class="contenedor">

<section class="tarjeta">

<h2>Nuevo Recibo</h2>

<form id="formRecibo">

<label>Cliente</label>
<input
type="text"
id="cliente"
placeholder="Nombre del cliente"
required>

<label>Periodo</label>
<input
type="text"
id="periodo"
placeholder="Ej. 01 al 15 de agosto de 2026"
required>

<label>Concepto</label>
<input
type="text"
id="concepto"
placeholder="Servicio realizado"
required>

<label>Importe</label>
<input
type="text"
id="importe"
placeholder="$0.00"
required>

<label>Forma de pago</label>

<select id="formaPago">

<option>Efectivo</option>
<option>Transferencia</option>
<option>Depósito</option>
<option>Cheque</option>

</select>

<div class="botones">

<button
type="submit">

Guardar Recibo

</button>

<button
type="reset">

Limpiar

</button>

</div>

</form>

</section>

</main>

<script type="module" src="../js/admin.js"></script>

</body>

</html>
