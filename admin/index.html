<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERMA | Panel Administrativo</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="encabezado">

<h1>ERMA Seguridad Privada</h1>

<p>Panel Administrativo</p>

</header>

<main>

<section class="contenedor">

<h2>Nuevo recibo</h2>

<form id="formRecibo">

<label for="cliente">Cliente</label>
<input
type="text"
id="cliente"
required>

<label for="periodo">Periodo</label>
<input
type="text"
id="periodo"
required>

<label for="importe">Importe</label>
<input
type="number"
id="importe"
required>

<label for="concepto">Concepto</label>
<input
type="text"
id="concepto"
required>

<label for="formaPago">Forma de pago</label>
<input
type="text"
id="formaPago"
required>

<button
type="button"
onclick="crearRecibo()">

Crear recibo

</button>

</form>

</section>

</main>

  <script type="module">

import { db } from "../firebase.js";

import {
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    async function crearRecibo() {

    const cliente = document.getElementById("cliente").value;
    const periodo = document.getElementById("periodo").value;
    const importe = document.getElementById("importe").value;
    const concepto = document.getElementById("concepto").value;
    const formaPago = document.getElementById("formaPago").value;

    const fecha = new Date().toLocaleDateString("es-MX");

    const codigo = "ERMA-" + Date.now();

    try {

    await addDoc(collection(db, "recibos"), {

        cliente,
        periodo,
        importe,
        concepto,
        formaPago,
        fecha,
        codigo,
        estado: "AUTÉNTICO"

    });

    alert("✅ Recibo guardado correctamente.");

     } catch (error) {

    console.error(error);

    alert("❌ " + error.message);

}

}

window.crearRecibo = crearRecibo;

    </script>

</body>
</html>
